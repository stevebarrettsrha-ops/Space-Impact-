<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DEEP — Submarine Odyssey</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    display:flex; align-items:center; justify-content:center; min-height:100%;
    background:radial-gradient(ellipse at 50% 20%, #0d3448 0%, #051724 45%, #01070c 100%);
    font-family:'Courier New', monospace; color:#cfe6f2; user-select:none;
  }
  #frame {
    position:relative;
    padding:10px; border-radius:10px;
    background:linear-gradient(160deg,#0d2735,#04121b);
    box-shadow:0 24px 60px rgba(0,0,0,.8), inset 0 1px 0 rgba(120,200,230,.12);
    border:1px solid #1b4759;
  }
  canvas#screen {
    display:block; background:#04121b; image-rendering:pixelated;
    image-rendering:crisp-edges; border-radius:3px; touch-action:none;
  }
  #fatal {
    display:none; position:fixed; inset:20px; padding:20px; overflow:auto;
    background:rgba(6,20,30,.96); border:1px solid #2b566b; border-radius:8px;
    color:#ffb0a0; white-space:pre-wrap; font-size:13px; line-height:1.5; z-index:99;
  }
  /* --- touch controls, only on coarse pointers ------------------------- */
  #touch { display:none; position:fixed; inset:0; z-index:20; pointer-events:none; }
  #touch .pad { position:absolute; pointer-events:auto; border-radius:50%;
    background:rgba(30,120,150,.16); border:1px solid rgba(120,220,255,.32); }
  #touch .btn { position:absolute; pointer-events:auto; border-radius:8px;
    background:rgba(30,120,150,.18); border:1px solid rgba(120,220,255,.3);
    color:#9fd8ee; font:bold 11px 'Courier New',monospace; letter-spacing:1px;
    display:flex; align-items:center; justify-content:center; }
  #touch .btn:active, #touch .pad:active { background:rgba(80,200,240,.35); }
  #stick { left:18px; bottom:22px; width:132px; height:132px; }
  #knob { position:absolute; left:41px; top:41px; width:50px; height:50px; border-radius:50%;
    background:rgba(120,220,255,.28); border:1px solid rgba(160,240,255,.5); pointer-events:none; }
  #bFire { right:22px; bottom:34px; width:82px; height:82px; border-radius:50%; }
  #bWeap { right:112px; bottom:96px; width:56px; height:34px; }
  #bAct  { right:22px; bottom:126px; width:56px; height:34px; }
  #bBack { left:14px; top:14px; width:52px; height:30px; }
  #bMenu { right:14px; top:14px; width:52px; height:30px; }
  @media (pointer:coarse) { #touch { display:block; } #frame { padding:0; border:none; border-radius:0; box-shadow:none; background:none; } }
</style>
</head>
<body>
<div id="frame"><canvas id="screen" width="240" height="320"></canvas></div>

<div id="touch">
  <div class="pad" id="stick"><div id="knob"></div></div>
  <div class="btn" id="bFire">FIRE</div>
  <div class="btn" id="bWeap">WEAP</div>
  <div class="btn" id="bAct">0</div>
  <div class="btn" id="bBack">BACK</div>
  <div class="btn" id="bMenu">MENU</div>
</div>

<pre id="fatal"></pre>

<script src="js/assets.js"></script>
<script src="js/model.js"></script>
<script src="js/gfx.js"></script>
<script src="js/ui2d.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/audio.js"></script>
<script src="js/flight.js"></script>
<script src="js/station.js"></script>
<script src="js/campaign.js"></script>
<script src="js/main.js"></script>
<script>
/* ---- touch layer: a virtual stick plus the phone keys the game expects --- */
(function () {
  const bind = (el, name) => {
    const on = e => { e.preventDefault(); Input.virtual(name, true); };
    const off = e => { e.preventDefault(); Input.virtual(name, false); };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    el.addEventListener('mousedown', on);
    window.addEventListener('mouseup', off);
  };
  bind(document.getElementById('bFire'), 'fire');
  bind(document.getElementById('bWeap'), 'weapon');
  bind(document.getElementById('bAct'), 'action');
  bind(document.getElementById('bBack'), 'back');
  bind(document.getElementById('bMenu'), 'pause');

  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let id = null, cx = 0, cy = 0;
  const R = 40;
  function set(dx, dy) {
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / R);
    Input.stick.x = (dx / d) * k;
    Input.stick.y = (dy / d) * k;
    knob.style.left = (41 + (dx / d) * k * R) + 'px';
    knob.style.top = (41 + (dy / d) * k * R) + 'px';
    /* also drive menu navigation as discrete presses */
    const now = Date.now();
    if (Math.abs(dy) > 24 && now - set.last > 190) {
      set.last = now; Input.virtual(dy < 0 ? 'up' : 'down', true);
      setTimeout(() => Input.virtual(dy < 0 ? 'up' : 'down', false), 40);
    }
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) && now - set.lastX > 220) {
      set.lastX = now; Input.virtual(dx < 0 ? 'left' : 'right', true);
      setTimeout(() => Input.virtual(dx < 0 ? 'left' : 'right', false), 40);
    }
  }
  set.last = 0; set.lastX = 0;
  function reset() { Input.stick.x = Input.stick.y = 0; knob.style.left = '41px'; knob.style.top = '41px'; }
  stick.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0], r = stick.getBoundingClientRect();
    id = t.identifier; cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    set(t.clientX - cx, t.clientY - cy);
  }, { passive: false });
  stick.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === id) set(t.clientX - cx, t.clientY - cy);
  }, { passive: false });
  const end = e => { for (const t of e.changedTouches) if (t.identifier === id) { id = null; reset(); } };
  stick.addEventListener('touchend', end, { passive: false });
  stick.addEventListener('touchcancel', end, { passive: false });
})();
</script>
</body>
</html>
