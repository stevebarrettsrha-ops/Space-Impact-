<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04121b">
<title>DEEP — Submarine Odyssey</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  body {
    display:flex; align-items:center; justify-content:center;
    padding-bottom:var(--band, 0px);
    background:radial-gradient(ellipse at 50% 20%, #0d3448 0%, #051724 45%, #01070c 100%);
    font-family:'Courier New', monospace; color:#cfe6f2; user-select:none;
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  }

  /* The cabinet around the screen. Gfx.resize() budgets for this padding and
     strips it (.bare) as soon as the window has no room to spare. */
  #frame {
    position:relative; padding:10px; border-radius:10px;
    background:linear-gradient(160deg,#0d2735,#04121b);
    box-shadow:0 24px 60px rgba(0,0,0,.8), inset 0 1px 0 rgba(120,200,230,.12);
    border:1px solid #1b4759;
  }
  #frame.bare { padding:0; border:0; border-radius:0; box-shadow:none; background:none; }

  /* Sized in JS: always a uniform scale, always exactly 3:4. */
  canvas#screen {
    display:block; background:#04121b; border-radius:3px; touch-action:none;
    image-rendering:pixelated; image-rendering:crisp-edges;
  }
  #frame.bare canvas#screen { border-radius:0; }

  #fatal {
    display:none; position:fixed; inset:16px; padding:18px; overflow:auto;
    background:rgba(6,20,30,.96); border:1px solid #2b566b; border-radius:8px;
    color:#ffb0a0; white-space:pre-wrap; font-size:13px; line-height:1.5; z-index:99;
  }

  /* ---- touch controls -------------------------------------------------
     Portrait puts them in a band below the screen, landscape in the side
     gutters, so they never sit on the picture unless there is nowhere else
     for them to go. ------------------------------------------------------ */
  #touch { display:none; position:fixed; inset:0; z-index:20; pointer-events:none; }
  html[data-layout="portrait"] #touch, html[data-layout="landscape"] #touch { display:block; }
  html[data-overlay="yes"] #touch { opacity:.72; }

  #touch .side { position:absolute; display:flex; align-items:center; gap:9px; }
  #touch .side > * { pointer-events:auto; }
  #touch .keys { display:flex; flex-direction:column; gap:7px; }

  html[data-layout="portrait"] .side { bottom:0; height:var(--band); }
  html[data-layout="portrait"] .side.left  { left:10px; }
  html[data-layout="portrait"] .side.right { right:10px; flex-direction:row-reverse; }
  html[data-layout="landscape"] .side { top:0; height:100%; }
  html[data-layout="landscape"] .side.left  { left:10px; }
  html[data-layout="landscape"] .side.right { right:10px; flex-direction:row-reverse; }

  #stick {
    position:relative; width:var(--ctl,120px); height:var(--ctl,120px); border-radius:50%;
    background:rgba(30,120,150,.16); border:1px solid rgba(120,220,255,.32);
  }
  #knob {
    position:absolute; left:31%; top:31%; width:38%; height:38%; border-radius:50%;
    background:rgba(120,220,255,.28); border:1px solid rgba(160,240,255,.5);
    pointer-events:none; will-change:transform;
  }
  .btn {
    display:flex; align-items:center; justify-content:center;
    background:rgba(30,120,150,.18); border:1px solid rgba(120,220,255,.3);
    color:#9fd8ee; font:bold 11px 'Courier New',monospace; letter-spacing:1px;
    border-radius:8px; padding:0 6px;
  }
  .btn:active, #stick:active { background:rgba(80,200,240,.35); }
  #bFire {
    width:calc(var(--ctl,120px) * .66); height:calc(var(--ctl,120px) * .66);
    border-radius:50%; font-size:12px;
  }
  .btn.key { width:var(--keyw,56px); height:32px; font-size:10px; }
</style>
</head>
<body>
<div id="frame"><canvas id="screen" width="240" height="320"></canvas></div>

<div id="touch">
  <div class="side left">
    <div id="stick"><div id="knob"></div></div>
    <div class="keys">
      <button class="btn key" id="bBack">BACK</button>
      <button class="btn key" id="bMenu">MENU</button>
    </div>
  </div>
  <div class="side right">
    <button class="btn" id="bFire">FIRE</button>
    <div class="keys">
      <button class="btn key" id="bWeap">WEAP</button>
      <button class="btn key" id="bAct">0</button>
    </div>
  </div>
</div>

<pre id="fatal"></pre>

<script src="js/assets.js"></script>
<script src="js/model.js"></script>
<script src="js/gfx.js"></script>
<script src="js/ui2d.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/audio.js"></script>
<script src="js/flight.js"></script>
<script src="js/station.js"></script>
<script src="js/campaign.js"></script>
<script src="js/main.js"></script>
<script>
/* ---- touch layer: a virtual stick plus the phone keys the game expects --- */
(function () {
  const bind = (el, name) => {
    const on = e => { e.preventDefault(); Input.virtual(name, true); };
    const off = e => { e.preventDefault(); Input.virtual(name, false); };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    el.addEventListener('mousedown', on);
    window.addEventListener('mouseup', off);
  };
  bind(document.getElementById('bFire'), 'fire');
  bind(document.getElementById('bWeap'), 'weapon');
  bind(document.getElementById('bAct'), 'action');
  bind(document.getElementById('bBack'), 'back');
  bind(document.getElementById('bMenu'), 'pause');

  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let id = null, cx = 0, cy = 0, radius = 40;
  let lastStep = 0, lastSide = 0;

  function set(dx, dy) {
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / radius);
    Input.stick.x = (dx / d) * k;
    Input.stick.y = (dy / d) * k;
    knob.style.transform = 'translate(' + (dx / d) * k * radius + 'px,' + (dy / d) * k * radius + 'px)';
    /* the stick also steps through menus, so it works on every screen */
    const now = Date.now(), reach = radius * 0.55;
    if (Math.abs(dy) > reach && now - lastStep > 190) {
      lastStep = now;
      const k2 = dy < 0 ? 'up' : 'down';
      Input.virtual(k2, true); setTimeout(() => Input.virtual(k2, false), 40);
    }
    if (Math.abs(dx) > reach && Math.abs(dx) > Math.abs(dy) && now - lastSide > 220) {
      lastSide = now;
      const k2 = dx < 0 ? 'left' : 'right';
      Input.virtual(k2, true); setTimeout(() => Input.virtual(k2, false), 40);
    }
  }
  function reset() {
    Input.stick.x = Input.stick.y = 0;
    knob.style.transform = 'translate(0,0)';
  }
  function grab(t) {
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    radius = Math.max(24, r.width * 0.34);
    set(t.clientX - cx, t.clientY - cy);
  }
  stick.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    id = t.identifier;
    grab(t);
  }, { passive: false });
  stick.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === id) set(t.clientX - cx, t.clientY - cy);
  }, { passive: false });
  const end = e => { for (const t of e.changedTouches) if (t.identifier === id) { id = null; reset(); } };
  stick.addEventListener('touchend', end, { passive: false });
  stick.addEventListener('touchcancel', end, { passive: false });
  window.addEventListener('gamelayout', reset);
})();
</script>
</body>
</html>
